services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustcenter
      POSTGRES_PASSWORD: trustcenter
      POSTGRES_DB: trustcenter
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trustcenter']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  dev-idp:
    build: ./tools/dev-idp
    environment:
      ISSUER: http://localhost:5556
      # Accepts both the `pnpm dev` origin (5173) and the Playwright e2e
      # preview server (4173) — see playwright.config.ts's `webServer.env`.
      REDIRECT_URIS: http://localhost:5173/auth/callback,http://localhost:4173/auth/callback
    ports:
      - '127.0.0.1:${DEV_IDP_PORT:-5556}:5556'

volumes:
  pgdata:
